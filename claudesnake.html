<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClaudeSnake 贪吃蛇</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #eceff1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
  }
  #stage {
    position: relative;
  }
  .snake-btn {
    font: bold 28px "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #ffffff;
    background: #fb8c00;
    border: none;
    border-radius: 10px;
    padding: 6px 14px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
  }
  .snake-btn:hover { background: #f57c00; }
  .snake-btn:active { transform: translateY(2px); box-shadow: 0 1px 5px rgba(0, 0, 0, 0.2); }
  #reset-btn {
    position: absolute;
    right: 16px;
    bottom: 16px;
  }
  /* 模式选择按钮：位于 WASD 提示文字下方，仅非游戏状态显示 */
  #mode-box {
    position: absolute;
    left: 50%;
    top: 480px;
    transform: translateX(-50%);
    display: none;
    gap: 16px;
  }
  #mode-box.show { display: flex; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="800" height="800"></canvas>
  <button id="reset-btn" class="snake-btn" type="button">重置</button>
  <div id="mode-box">
    <button id="solo-btn" class="snake-btn" type="button">独自游玩</button>
    <button id="ai-btn" class="snake-btn" type="button">AI游玩</button>
  </div>
</div>
<script>
(function () {
  'use strict';

  // ---------- 常量 ----------
  const COLS = 20;                // 地图列数
  const ROWS = 20;                // 地图行数
  const CELL_SIZE = 30;           // 单格尺寸（px）
  const CANVAS_SIZE = 800;        // 画布整体尺寸（px）
  const TICK_MS = 200;            // 固定 200ms 每帧，全程速度不变
  const GRID_SIZE = COLS * CELL_SIZE;              // 地图 600px
  const OFFSET = (CANVAS_SIZE - GRID_SIZE) / 2;    // 地图在画布中居中，偏移 100px

  const STATE = { WELCOME: 'welcome', PLAYING: 'playing', OVER: 'over', WIN: 'win' };
  const DIRS = { w: 'up', s: 'down', a: 'left', d: 'right' };
  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
  const FONT = '"Microsoft YaHei", "PingFang SC", sans-serif';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ---------- 游戏状态 ----------
  let state = STATE.WELCOME;
  let snake = [];         // 蛇身坐标 [x, y]，第 0 项是蛇头
  let dir = 'right';      // 当前实际移动方向
  let nextDir = 'right';  // 下一次移动方向（按键立即生效）
  let food = null;        // 食物坐标 [x, y]
  let score = 0;         // 本局得分（每局从 0 开始）
  let totalScore = 0;    // 累计得分（新一局不清零，仅「重置」按钮清零）
  let highScore = 0;     // 最高分（单局最高分，新一局不清零）
  let games = 0;         // 局数（新一局不清零）
  let timer = null;
  let mode = 'solo';   // 操控模式：'solo' = WASD 人工操控，'ai' = AI 全权操控

  // ---------- 工具 ----------
  function cellRect(c) {
    return [OFFSET + c[0] * CELL_SIZE, OFFSET + c[1] * CELL_SIZE, CELL_SIZE, CELL_SIZE];
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function stopTimer() {
    if (timer !== null) {
      clearInterval(timer);
      timer = null;
    }
  }

  // ---------- 游戏逻辑 ----------
  function resetGame() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [];
    // 蛇头出生在地图中间，初始长度 4，默认朝右
    for (let i = 0; i < 4; i++) {
      snake.push([cx - i, cy]);
    }
    dir = 'right';
    nextDir = 'right';
    score = 0; // 仅清零本局得分，累计得分 / 最高分 / 局数保留
    spawnFood();
  }

  // 生成食物：遍历所有空格子随机选取，保证不出现在蛇身坐标上
  function spawnFood() {
    const occupied = new Set(snake.map(s => s[0] + ',' + s[1]));
    const free = [];
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        if (!occupied.has(x + ',' + y)) free.push([x, y]);
      }
    }
    if (free.length === 0) return false;
    food = free[Math.floor(Math.random() * free.length)];
    return true;
  }

  function endGame(win) {
    state = win ? STATE.WIN : STATE.OVER;
    stopTimer();
    draw(); // 不输出死亡原因，分数保留
  }

  // ---------- AI ----------
  // 每帧用 BFS 从蛇头出发搜索到食物的最短可行路径（蛇身与墙壁视为不可通行障碍），
  // 取路径第一步作为下一步方向；无路径时选安全方向续命，四面堵死返回 null。
  function aiDecide() {
    const head = snake[0];
    const startKey = head[0] + ',' + head[1];
    const targetKey = food[0] + ',' + food[1];
    const blocked = new Set(snake.map(s => s[0] + ',' + s[1])); // 整个蛇身均为障碍

    const prev = {};                 // key -> 前驱 key，用于回溯最短路径
    const visited = new Set([startKey]);
    const queue = [head];
    while (queue.length > 0) {
      const [x, y] = queue.shift();
      if (x === food[0] && y === food[1]) break; // 到达食物，结束搜索
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx;
        const ny = y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue; // 墙壁不可通行
        const key = nx + ',' + ny;
        if (visited.has(key) || blocked.has(key)) continue;
        visited.add(key);
        prev[key] = x + ',' + y;
        queue.push([nx, ny]);
      }
    }

    if (visited.has(targetKey)) {
      // 从食物沿前驱回溯到「蛇头的下一步」格子
      let step = targetKey;
      while (prev[step] !== startKey) step = prev[step];
      const [sx, sy] = step.split(',').map(Number);
      if (sx > head[0]) return 'right';
      if (sx < head[0]) return 'left';
      if (sy > head[1]) return 'down';
      return 'up';
    }

    // 无路到达食物：优先保持当前方向，其次选任意安全方向续命
    // （本帧蛇尾会移开，蛇尾所在格子视为安全）
    const safeBody = new Set(snake.slice(0, -1).map(s => s[0] + ',' + s[1]));
    const order = [dir];
    for (const d of ['up', 'down', 'left', 'right']) {
      if (d !== dir) order.push(d);
    }
    for (const d of order) {
      const nx = head[0] + (d === 'right' ? 1 : d === 'left' ? -1 : 0);
      const ny = head[1] + (d === 'down' ? 1 : d === 'up' ? -1 : 0);
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      if (safeBody.has(nx + ',' + ny)) continue;
      return d;
    }
    return null; // 四面八方都被堵死
  }

  function tick() {
    if (state !== STATE.PLAYING) return;

    // AI 模式：每帧由 BFS 决定下一步方向，WASD 输入被忽略
    if (mode === 'ai') {
      const aiDir = aiDecide();
      if (aiDir === null) {
        endGame(false);
        return;
      }
      nextDir = aiDir;
    }

    dir = nextDir;
    const head = snake[0];
    let nx = head[0];
    let ny = head[1];
    if (dir === 'right') nx++;
    else if (dir === 'left') nx--;
    else if (dir === 'up') ny--;
    else if (dir === 'down') ny++;

    // 1. 撞击画布墙壁边界 → 结束
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
      endGame(false);
      return;
    }

    const eating = food !== null && nx === food[0] && ny === food[1];

    // 2. 蛇头碰撞自身蛇身 → 结束
    //    （未吃到食物时蛇尾本帧会移开，不算碰撞）
    const body = eating ? snake : snake.slice(0, -1);
    for (const seg of body) {
      if (seg[0] === nx && seg[1] === ny) {
        endGame(false);
        return;
      }
    }

    snake.unshift([nx, ny]);

    if (eating) {
      score++;       // 本局得分 +1
      totalScore++;  // 累计得分 +1（新一局不清零）
      if (score > highScore) highScore = score; // 实时刷新最高分
      if (snake.length >= COLS * ROWS) {
        endGame(true); // 蛇完全占满全部地图网格 → 胜利通关
        return;
      }
      spawnFood(); // 吃掉食物后立刻重新生成合法位置的食物
    } else {
      snake.pop();
    }

    draw();
  }

  function startGame(m) {
    if (m === 'solo' || m === 'ai') mode = m; // 不传模式则沿用当前模式（如「重置」按钮重开）
    state = STATE.PLAYING;
    games++; // 每开始一局，局数 +1
    stopTimer();
    timer = setInterval(tick, TICK_MS);
    draw();
  }

  function restartGame(m) {
    resetGame();
    startGame(m);
  }

  // ---------- 绘制 ----------
  function overlay() {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  }

  function centerText(text, y, size, color, bold) {
    ctx.fillStyle = color;
    ctx.font = (bold ? 'bold ' : '') + size + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, CANVAS_SIZE / 2, y);
  }

  function draw() {
    // 模式选择按钮仅在非游戏状态（欢迎 / 结束 / 胜利界面）显示
    modeBox.classList.toggle('show', state !== STATE.PLAYING);

    // 画布背景：纯白色
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

    // 网格线
    ctx.strokeStyle = '#e3e6e8';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= COLS; i++) {
      const x = OFFSET + i * CELL_SIZE;
      ctx.moveTo(x, OFFSET);
      ctx.lineTo(x, OFFSET + GRID_SIZE);
    }
    for (let j = 0; j <= ROWS; j++) {
      const y = OFFSET + j * CELL_SIZE;
      ctx.moveTo(OFFSET, y);
      ctx.lineTo(OFFSET + GRID_SIZE, y);
    }
    ctx.stroke();

    // 地图外边框
    ctx.strokeStyle = '#90a4ae';
    ctx.lineWidth = 2;
    ctx.strokeRect(OFFSET, OFFSET, GRID_SIZE, GRID_SIZE);

    // 食物：蓝色，30×30px，占满完整格子
    if (food !== null) {
      const [fx, fy] = cellRect(food);
      ctx.fillStyle = '#1e88e5';
      ctx.fillRect(fx, fy, CELL_SIZE, CELL_SIZE);
    }

    // 蛇身：橙色，30×30px，3px 圆角
    ctx.fillStyle = '#fb8c00';
    for (let i = snake.length - 1; i >= 1; i--) {
      const [bx, by] = cellRect(snake[i]);
      roundRect(bx, by, CELL_SIZE, CELL_SIZE, 3);
    }

    // 蛇头：红色，30×30px，与蛇身尺寸一致，小圆角
    const [hx, hy] = cellRect(snake[0]);
    ctx.fillStyle = '#e53935';
    roundRect(hx, hy, CELL_SIZE, CELL_SIZE, 3);

    // 覆盖层：欢迎 / 结束 / 胜利
    if (state === STATE.WELCOME) {
      overlay();
      centerText('贪吃蛇', 330, 52, '#263238', true);
      centerText('点击下方按钮开始游戏', 405, 24, '#263238', false);
      centerText('W A S D 控制方向 · P 结束游戏', 452, 18, '#607d8b', false);
    } else if (state === STATE.OVER) {
      overlay();
      centerText('游戏结束', 330, 48, '#c62828', true);
      centerText('本局得分：' + score, 400, 28, '#263238', false);
      centerText('点击下方按钮重新开始', 452, 20, '#607d8b', false);
    } else if (state === STATE.WIN) {
      overlay();
      centerText('胜利通关！', 330, 48, '#2e7d32', true);
      centerText('本局得分：' + score, 400, 28, '#263238', false);
      centerText('点击下方按钮重新开始', 452, 20, '#607d8b', false);
    }

    // 计分板：得分 / 最高分 / 局数 从左到右紧贴平铺，位于地图（贪吃蛇活动区域）上边界上方
    ctx.fillStyle = '#263238';
    ctx.font = 'bold 28px ' + FONT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('得分：' + totalScore + '  最高分：' + highScore + '  局数：' + games, OFFSET, 50);
  }

  // ---------- 键盘 ----------
  function onKeyDown(e) {
    if (state !== STATE.PLAYING) return; // 开始 / 重新开局均由模式按钮完成，空格键已移除

    const key = e.key.toLowerCase();
    if (mode === 'solo' && DIRS.hasOwnProperty(key)) {
      const want = DIRS[key];
      // 以当前实际移动方向判断：禁止 180° 反向掉头，反向输入直接忽略
      if (want !== OPPOSITE[dir]) {
        nextDir = want; // 按下按键立即生效转向，无需回车确认
      }
    } else if (key === 'p') {
      endGame(false); // 按下 P 键手动结束本局（独自 / AI 模式均生效）
    }
  }

  window.addEventListener('keydown', onKeyDown);

  // ---------- 「重置」按钮 ----------
  const resetBtn = document.getElementById('reset-btn');

  function resetAll() {
    totalScore = 0;
    highScore = 0;
    games = 0;
    if (state === STATE.PLAYING) {
      restartGame(); // 游戏中点击：清零记录并重新开始本局
    } else {
      resetGame();   // 欢迎 / 结束界面点击：清零记录并复位棋盘
      draw();
    }
  }

  resetBtn.addEventListener('click', function () {
    resetAll();
    this.blur(); // 点击后移除焦点，避免之后按回车 / 空格误触发按钮
  });

  // ---------- 「独自游玩」/「AI游玩」按钮 ----------
  // 仅在欢迎 / 结束 / 胜利界面显示，点击即以对应模式开始新一局
  const modeBox = document.getElementById('mode-box');
  const soloBtn = document.getElementById('solo-btn');
  const aiBtn = document.getElementById('ai-btn');

  soloBtn.addEventListener('click', function () {
    restartGame('solo');
    this.blur();
  });

  aiBtn.addEventListener('click', function () {
    restartGame('ai');
    this.blur();
  });

  // ---------- 初始化 ----------
  resetGame();
  draw();
})();
</script>
</body>
</html>
