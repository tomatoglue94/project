<!DOCTYPE html>
<html lang="zh-CN" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClaudeSnake 贪吃蛇</title>
<style>
  /* ---------- 主题变量 ----------
     两套风格各定义一套变量，按钮 / 画布 / 页面底色只写一次规则；
     切换主题 = 换 <html data-theme>，新增风格只要再加一段变量即可。 */
  :root[data-theme="green"] {
    --page-bg: #050D08;                                   /* 页面底色：近黑墨绿 */
    --btn-bg: #08120C;
    --btn-bg-hover: #0E2018;
    --btn-fg: #3DFF9E;                                    /* 按钮文字：荧光绿 */
    --btn-border: 2px solid #1E4634;
    --btn-border-hover: 2px solid #3DFF9E;
    --btn-radius: 2px;                                    /* 近直角，CRT 面板感 */
    --btn-font: "Microsoft YaHei", "PingFang SC", sans-serif;
    --btn-text-shadow: 0 0 8px rgba(61, 255, 158, 0.55);  /* 荧光字晕 */
    --btn-shadow: none;
    --btn-shadow-hover: 0 0 14px rgba(61, 255, 158, 0.35);
    --btn-active-ring: 0 0 0 1px #3DFF9E, 0 0 14px rgba(61, 255, 158, 0.45);
    --canvas-radius: 0;
    --canvas-shadow: 0 0 40px rgba(61, 255, 158, 0.18);
  }
  :root[data-theme="neon"] {
    --page-bg: #12061F;                                   /* 页面底色：深紫罗兰 */
    --btn-bg: rgba(255, 79, 216, 0.08);
    --btn-bg-hover: rgba(255, 79, 216, 0.20);
    --btn-fg: #FFE3FB;                                    /* 按钮文字：淡粉白 */
    --btn-border: 2px solid #FF4FD8;                      /* 品红描边 */
    --btn-border-hover: 2px solid #FF6FE0;
    --btn-radius: 14px;                                   /* 大圆角，蒸汽波 */
    --btn-font: "Microsoft YaHei", "PingFang SC", sans-serif;
    --btn-text-shadow: none;
    --btn-shadow: 0 0 14px rgba(255, 79, 216, 0.45), inset 0 0 12px rgba(92, 225, 230, 0.12);
    --btn-shadow-hover: 0 0 22px rgba(255, 79, 216, 0.70), inset 0 0 14px rgba(92, 225, 230, 0.20);
    --btn-active-ring: 0 0 0 2px #5CE1E6, 0 0 18px rgba(92, 225, 230, 0.60); /* 青色描边，与品红对比 */
    --canvas-radius: 14px;
    --canvas-shadow: 0 0 40px rgba(255, 79, 216, 0.25), 0 0 80px rgba(92, 225, 230, 0.15);
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--page-bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    border-radius: var(--canvas-radius);
    box-shadow: var(--canvas-shadow);
  }
  #stage {
    position: relative;
  }
  .snake-btn {
    font-family: var(--btn-font);
    font-size: 28px;
    font-weight: bold;
    color: var(--btn-fg);
    background: var(--btn-bg);
    border: var(--btn-border);
    border-radius: var(--btn-radius);
    padding: 6px 14px;
    cursor: pointer;
    text-shadow: var(--btn-text-shadow);
    box-shadow: var(--btn-shadow);
    transition: background-color 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .snake-btn:hover {
    background: var(--btn-bg-hover);
    border: var(--btn-border-hover);
    box-shadow: var(--btn-shadow-hover);
  }
  .snake-btn:active { transform: translateY(2px); }
  #reset-btn {
    position: absolute;
    right: 16px;
    bottom: 16px;
  }
  /* 模式选择按钮：位于 WASD 提示文字下方，仅非游戏状态显示 */
  #mode-box {
    position: absolute;
    left: 50%;
    top: 480px;
    transform: translateX(-50%);
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #mode-box.show { display: flex; }
  /* 上行：模式按钮；下行：配色风格按钮 */
  #mode-row, #style-row {
    display: flex;
    gap: 16px;
  }
  /* 当前配色风格的激活标记：颜色随主题变（磷光绿=荧光绿描边，霓虹风=青色描边）。
     写在 :hover 之后，保证悬停时激活标记不会被 --btn-shadow-hover 顶掉。 */
  .snake-btn.active { box-shadow: var(--btn-active-ring); }
  .snake-btn.active:hover {
    background: var(--btn-bg-hover);
    border: var(--btn-border-hover);
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="800" height="800"></canvas>
  <button id="reset-btn" class="snake-btn" type="button">重置</button>
  <div id="mode-box">
    <div id="mode-row">
      <button id="solo-btn" class="snake-btn" type="button">独自游玩</button>
      <button id="ai-btn" class="snake-btn" type="button">AI游玩</button>
    </div>
    <div id="style-row">
      <button id="style-green-btn" class="snake-btn" type="button">磷光绿</button>
      <button id="style-neon-btn" class="snake-btn" type="button">霓虹风</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  // ---------- 常量 ----------
  const COLS = 20;                // 地图列数
  const ROWS = 20;                // 地图行数
  const CELL_SIZE = 30;           // 单格尺寸（px）
  const CANVAS_SIZE = 800;        // 画布整体尺寸（px）
  const TICK_MS = 200;            // 固定 200ms 每帧，全程速度不变
  const GRID_SIZE = COLS * CELL_SIZE;              // 地图 600px
  const OFFSET = (CANVAS_SIZE - GRID_SIZE) / 2;    // 地图在画布中居中，偏移 100px

  const STATE = { WELCOME: 'welcome', PLAYING: 'playing', OVER: 'over', WIN: 'win' };
  const DIRS = { w: 'up', s: 'down', a: 'left', d: 'right' };
  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

  // ---------- 配色主题 ----------
  // 两套主题共用同一套绘制逻辑，只有颜色不同；默认 phosphor green。
  const THEMES = {
    // 磷光绿 CRT：深墨绿底 + 单色磷光绿，网格刻意压低对比
    green: {
      canvasBg: '#08120C',                 // 画布底色
      grid: 'rgba(61, 255, 158, 0.12)',    // 网格线
      gridGlow: null,                      // 网格辉光（磷光绿不加）
      border: '#1E4634',                   // 地图外框
      snake: '#3DFF9E',                    // 蛇身（靠近头部一端）
      snakeTail: '#1E9E63',                // 蛇身（尾部渐变终点）
      head: '#B4FFD9',                     // 蛇头
      food: '#FF5A5F',                     // 食物
      glow: 'rgba(61, 255, 158, 0.25)',    // 蛇身 / 蛇头辉光
      foodGlow: 'rgba(255, 90, 95, 0.50)', // 食物辉光
      hud: '#7FFFC4',                      // 计分文字
      overlay: 'rgba(8, 18, 12, 0.88)',    // 欢迎 / 结束 / 胜利覆盖层
      title: '#B4FFD9',                    // 欢迎标题
      over: '#FF5A5F',                     // 「游戏结束」标题
      win: '#3DFF9E',                      // 「胜利通关」标题
      text: '#C9FFE2',                     // 覆盖层正文
      textDim: '#6FC79A',                  // 覆盖层次要文字
      font: '"Microsoft YaHei", "PingFang SC", sans-serif'
    },
    // 霓虹风（蒸汽波）：深紫罗兰底 + 发光青色网格 + 品红蛇身
    neon: {
      canvasBg: '#16082B',
      grid: 'rgba(92, 225, 230, 0.22)',
      gridGlow: 'rgba(92, 225, 230, 0.55)', // 网格主动发光，是这套风格的核心
      border: '#FF4FD8',
      snake: '#FF5FD9',
      snakeTail: '#8A3FD1',
      head: '#FFE3FB',
      food: '#5CE1E6',
      glow: 'rgba(255, 95, 217, 0.35)',
      foodGlow: 'rgba(92, 225, 230, 0.50)',
      hud: '#FFD86B',
      overlay: 'rgba(22, 8, 43, 0.88)',
      title: '#FFE3FB',
      over: '#FF5A5F',
      win: '#5CE1E6',
      text: '#FFE3FB',
      textDim: '#B98FD9',
      font: '"Microsoft YaHei", "PingFang SC", sans-serif'
    }
  };
  const GLOW_BLUR = 12;   // 蛇身 / 蛇头辉光半径
  const GRID_BLUR = 6;    // 网格线辉光半径（仅霓虹风）

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ---------- 游戏状态 ----------
  let state = STATE.WELCOME;
  let snake = [];         // 蛇身坐标 [x, y]，第 0 项是蛇头
  let dir = 'right';      // 当前实际移动方向
  let nextDir = 'right';  // 下一次移动方向（按键立即生效）
  let food = null;        // 食物坐标 [x, y]
  let score = 0;         // 本局得分（每局从 0 开始）
  let totalScore = 0;    // 累计得分（新一局不清零，仅「重置」按钮清零）
  let highScore = 0;     // 最高分（单局最高分，新一局不清零）
  let games = 0;         // 局数（新一局不清零）
  let timer = null;
  let mode = 'solo';   // 操控模式：'solo' = WASD 人工操控，'ai' = AI 全权操控
  let themeName = 'green'; // 当前配色主题：'green' = 磷光绿（默认），'neon' = 霓虹风

  // ---------- 工具 ----------
  function cellRect(c) {
    return [OFFSET + c[0] * CELL_SIZE, OFFSET + c[1] * CELL_SIZE, CELL_SIZE, CELL_SIZE];
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // 十六进制颜色线性插值，用于蛇身「头亮尾暗」的渐变
  function mixColor(a, b, t) {
    const ca = parseInt(a.slice(1), 16);
    const cb = parseInt(b.slice(1), 16);
    const r = Math.round((ca >> 16 & 255) + ((cb >> 16 & 255) - (ca >> 16 & 255)) * t);
    const g = Math.round((ca >> 8 & 255) + ((cb >> 8 & 255) - (ca >> 8 & 255)) * t);
    const bl = Math.round((ca & 255) + ((cb & 255) - (ca & 255)) * t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  function stopTimer() {
    if (timer !== null) {
      clearInterval(timer);
      timer = null;
    }
  }

  // ---------- 游戏逻辑 ----------
  function resetGame() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [];
    // 蛇头出生在地图中间，初始长度 4，默认朝右
    for (let i = 0; i < 4; i++) {
      snake.push([cx - i, cy]);
    }
    dir = 'right';
    nextDir = 'right';
    score = 0; // 仅清零本局得分，累计得分 / 最高分 / 局数保留
    spawnFood();
  }

  // 生成食物：遍历所有空格子随机选取，保证不出现在蛇身坐标上
  function spawnFood() {
    const occupied = new Set(snake.map(s => s[0] + ',' + s[1]));
    const free = [];
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        if (!occupied.has(x + ',' + y)) free.push([x, y]);
      }
    }
    if (free.length === 0) return false;
    food = free[Math.floor(Math.random() * free.length)];
    return true;
  }

  function endGame(win) {
    state = win ? STATE.WIN : STATE.OVER;
    stopTimer();
    draw(); // 不输出死亡原因，分数保留
  }

  // ---------- AI ----------
  // 每帧用 BFS 从蛇头出发搜索到食物的最短可行路径（蛇身与墙壁视为不可通行障碍），
  // 取路径第一步作为下一步方向；无路径时选安全方向续命，四面堵死返回 null。
  function aiDecide() {
    const head = snake[0];
    const startKey = head[0] + ',' + head[1];
    const targetKey = food[0] + ',' + food[1];
    const blocked = new Set(snake.map(s => s[0] + ',' + s[1])); // 整个蛇身均为障碍

    const prev = {};                 // key -> 前驱 key，用于回溯最短路径
    const visited = new Set([startKey]);
    const queue = [head];
    while (queue.length > 0) {
      const [x, y] = queue.shift();
      if (x === food[0] && y === food[1]) break; // 到达食物，结束搜索
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx;
        const ny = y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue; // 墙壁不可通行
        const key = nx + ',' + ny;
        if (visited.has(key) || blocked.has(key)) continue;
        visited.add(key);
        prev[key] = x + ',' + y;
        queue.push([nx, ny]);
      }
    }

    if (visited.has(targetKey)) {
      // 从食物沿前驱回溯到「蛇头的下一步」格子
      let step = targetKey;
      while (prev[step] !== startKey) step = prev[step];
      const [sx, sy] = step.split(',').map(Number);
      if (sx > head[0]) return 'right';
      if (sx < head[0]) return 'left';
      if (sy > head[1]) return 'down';
      return 'up';
    }

    // 无路到达食物：优先保持当前方向，其次选任意安全方向续命
    // （本帧蛇尾会移开，蛇尾所在格子视为安全）
    const safeBody = new Set(snake.slice(0, -1).map(s => s[0] + ',' + s[1]));
    const order = [dir];
    for (const d of ['up', 'down', 'left', 'right']) {
      if (d !== dir) order.push(d);
    }
    for (const d of order) {
      const nx = head[0] + (d === 'right' ? 1 : d === 'left' ? -1 : 0);
      const ny = head[1] + (d === 'down' ? 1 : d === 'up' ? -1 : 0);
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      if (safeBody.has(nx + ',' + ny)) continue;
      return d;
    }
    return null; // 四面八方都被堵死
  }

  function tick() {
    if (state !== STATE.PLAYING) return;

    // AI 模式：每帧由 BFS 决定下一步方向，WASD 输入被忽略
    if (mode === 'ai') {
      const aiDir = aiDecide();
      if (aiDir === null) {
        endGame(false);
        return;
      }
      nextDir = aiDir;
    }

    dir = nextDir;
    const head = snake[0];
    let nx = head[0];
    let ny = head[1];
    if (dir === 'right') nx++;
    else if (dir === 'left') nx--;
    else if (dir === 'up') ny--;
    else if (dir === 'down') ny++;

    // 1. 撞击画布墙壁边界 → 结束
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
      endGame(false);
      return;
    }

    const eating = food !== null && nx === food[0] && ny === food[1];

    // 2. 蛇头碰撞自身蛇身 → 结束
    //    （未吃到食物时蛇尾本帧会移开，不算碰撞）
    const body = eating ? snake : snake.slice(0, -1);
    for (const seg of body) {
      if (seg[0] === nx && seg[1] === ny) {
        endGame(false);
        return;
      }
    }

    snake.unshift([nx, ny]);

    if (eating) {
      score++;       // 本局得分 +1
      totalScore++;  // 累计得分 +1（新一局不清零）
      if (score > highScore) highScore = score; // 实时刷新最高分
      if (snake.length >= COLS * ROWS) {
        endGame(true); // 蛇完全占满全部地图网格 → 胜利通关
        return;
      }
      spawnFood(); // 吃掉食物后立刻重新生成合法位置的食物
    } else {
      snake.pop();
    }

    draw();
  }

  function startGame(m) {
    if (m === 'solo' || m === 'ai') mode = m; // 不传模式则沿用当前模式（如「重置」按钮重开）
    state = STATE.PLAYING;
    games++; // 每开始一局，局数 +1
    stopTimer();
    timer = setInterval(tick, TICK_MS);
    draw();
  }

  function restartGame(m) {
    resetGame();
    startGame(m);
  }

  // ---------- 绘制 ----------
  function overlay(theme) {
    ctx.fillStyle = theme.overlay;
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  }

  // 字体取自当前主题（颜色仍由调用方传入），因此画布文字也跟着风格切换
  function centerText(text, y, size, color, bold) {
    ctx.fillStyle = color;
    ctx.font = (bold ? 'bold ' : '') + size + 'px ' + THEMES[themeName].font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, CANVAS_SIZE / 2, y);
  }

  function draw() {
    const theme = THEMES[themeName];

    // 模式选择按钮仅在非游戏状态（欢迎 / 结束 / 胜利界面）显示
    modeBox.classList.toggle('show', state !== STATE.PLAYING);

    // 画布背景
    ctx.fillStyle = theme.canvasBg;
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

    // 网格线（霓虹风的网格主动发光，是该风格的核心符号）
    if (theme.gridGlow) {
      ctx.shadowColor = theme.gridGlow;
      ctx.shadowBlur = GRID_BLUR;
    }
    ctx.strokeStyle = theme.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= COLS; i++) {
      const x = OFFSET + i * CELL_SIZE;
      ctx.moveTo(x, OFFSET);
      ctx.lineTo(x, OFFSET + GRID_SIZE);
    }
    for (let j = 0; j <= ROWS; j++) {
      const y = OFFSET + j * CELL_SIZE;
      ctx.moveTo(OFFSET, y);
      ctx.lineTo(OFFSET + GRID_SIZE, y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 地图外边框
    ctx.strokeStyle = theme.border;
    ctx.lineWidth = 2;
    ctx.strokeRect(OFFSET, OFFSET, GRID_SIZE, GRID_SIZE);

    // 食物：30×30px，占满完整格子
    if (food !== null) {
      const [fx, fy] = cellRect(food);
      ctx.fillStyle = theme.food;
      ctx.shadowColor = theme.foodGlow;
      ctx.shadowBlur = 16;
      ctx.fillRect(fx, fy, CELL_SIZE, CELL_SIZE);
      ctx.shadowBlur = 0;
    }

    // 蛇身：30×30px，3px 圆角，由头到尾从亮渐暗
    const bodyCount = snake.length - 1;
    for (let i = bodyCount; i >= 1; i--) {
      const [bx, by] = cellRect(snake[i]);
      const t = bodyCount > 1 ? (i - 1) / (bodyCount - 1) : 0;
      ctx.fillStyle = mixColor(theme.snake, theme.snakeTail, t);
      ctx.shadowColor = theme.glow;
      ctx.shadowBlur = GLOW_BLUR;
      roundRect(bx, by, CELL_SIZE, CELL_SIZE, 3);
    }
    ctx.shadowBlur = 0;

    // 蛇头：与蛇身尺寸一致，小圆角
    const [hx, hy] = cellRect(snake[0]);
    ctx.fillStyle = theme.head;
    ctx.shadowColor = theme.glow;
    ctx.shadowBlur = GLOW_BLUR;
    roundRect(hx, hy, CELL_SIZE, CELL_SIZE, 3);
    ctx.shadowBlur = 0;

    // 覆盖层：欢迎 / 结束 / 胜利
    if (state === STATE.WELCOME) {
      overlay(theme);
      centerText('贪吃蛇', 330, 52, theme.title, true);
      centerText('点击下方按钮开始游戏', 405, 24, theme.text, false);
      centerText('W A S D 控制方向 · P 结束游戏', 452, 18, theme.textDim, false);
    } else if (state === STATE.OVER) {
      overlay(theme);
      centerText('游戏结束', 330, 48, theme.over, true);
      centerText('本局得分：' + score, 400, 28, theme.text, false);
      centerText('点击下方按钮重新开始', 452, 20, theme.textDim, false);
    } else if (state === STATE.WIN) {
      overlay(theme);
      centerText('胜利通关！', 330, 48, theme.win, true);
      centerText('本局得分：' + score, 400, 28, theme.text, false);
      centerText('点击下方按钮重新开始', 452, 20, theme.textDim, false);
    }

    // 计分板：得分 / 最高分 / 局数 从左到右紧贴平铺，位于地图（贪吃蛇活动区域）上边界上方
    ctx.fillStyle = theme.hud;
    ctx.font = 'bold 28px ' + theme.font;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('得分：' + totalScore + '  最高分：' + highScore + '  局数：' + games, OFFSET, 50);
  }

  // ---------- 键盘 ----------
  function onKeyDown(e) {
    if (state !== STATE.PLAYING) return; // 开始 / 重新开局均由模式按钮完成，空格键已移除

    const key = e.key.toLowerCase();
    if (mode === 'solo' && DIRS.hasOwnProperty(key)) {
      const want = DIRS[key];
      // 以当前实际移动方向判断：禁止 180° 反向掉头，反向输入直接忽略
      if (want !== OPPOSITE[dir]) {
        nextDir = want; // 按下按键立即生效转向，无需回车确认
      }
    } else if (key === 'p') {
      endGame(false); // 按下 P 键手动结束本局（独自 / AI 模式均生效）
    }
  }

  window.addEventListener('keydown', onKeyDown);

  // ---------- 「重置」按钮 ----------
  const resetBtn = document.getElementById('reset-btn');

  // 「重置」：无论当前处于游戏中还是结束界面，一律回到主菜单
  // （主菜单 = 欢迎界面，可在此选择配色风格与游玩方式）
  function resetAll() {
    totalScore = 0;
    highScore = 0;
    games = 0;
    stopTimer();           // 游戏中点击时先停掉计时器
    state = STATE.WELCOME; // 回到主菜单
    resetGame();           // 复位棋盘、蛇身与食物
    draw();
  }

  resetBtn.addEventListener('click', function () {
    resetAll();
    this.blur(); // 点击后移除焦点，避免之后按回车 / 空格误触发按钮
  });

  // ---------- 「独自游玩」/「AI游玩」按钮 ----------
  // 仅在欢迎 / 结束 / 胜利界面显示，点击即以对应模式开始新一局
  const modeBox = document.getElementById('mode-box');
  const soloBtn = document.getElementById('solo-btn');
  const aiBtn = document.getElementById('ai-btn');

  soloBtn.addEventListener('click', function () {
    restartGame('solo');
    this.blur();
  });

  aiBtn.addEventListener('click', function () {
    restartGame('ai');
    this.blur();
  });

  // ---------- 「磷光绿」/「霓虹风」风格按钮 ----------
  // 与模式按钮同容器，因此同样只在非游戏状态显示；切换后立即重绘当前画面
  const greenBtn = document.getElementById('style-green-btn');
  const neonBtn = document.getElementById('style-neon-btn');

  // 把当前风格写到 <html data-theme> 上，CSS 变量按该属性取值，
  // 按钮 / 页面底色 / 画布圆角与阴影随之切换
  function applyTheme() {
    document.documentElement.dataset.theme = themeName;
  }

  function syncThemeButtons() {
    greenBtn.classList.toggle('active', themeName === 'green');
    neonBtn.classList.toggle('active', themeName === 'neon');
  }

  function setTheme(name) {
    if (name === themeName) return; // 已经是该风格：不响应，也不重绘
    themeName = name;
    applyTheme();
    syncThemeButtons();
    draw();
  }

  greenBtn.addEventListener('click', function () {
    setTheme('green');
    this.blur();
  });

  neonBtn.addEventListener('click', function () {
    setTheme('neon');
    this.blur();
  });

  // ---------- 初始化 ----------
  applyTheme();   // 与 <html data-theme="green"> 对齐，让 JS 成为主题的唯一数据源
  syncThemeButtons();
  resetGame();
  draw();
})();
</script>
</body>
</html>
