<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #ececec;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .game-wrap {
    position: relative;
    width: 600px;
    height: 600px;
  }
  canvas {
    display: block;
    width: 600px;
    height: 600px;
    background: #ffffff;
    border: 2px solid #333333;
    border-radius: 4px;
  }
  .score {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 20px;
    font-weight: bold;
    color: #222222;
    background: rgba(255, 255, 255, 0.85);
    padding: 4px 12px;
    border-radius: 6px;
    user-select: none;
  }
</style>
</head>
<body>
  <div class="game-wrap">
    <canvas id="game" width="600" height="600"></canvas>
    <div class="score" id="score">分数：0</div>
  </div>

<script>
(function () {
  "use strict";

  // ===== 常量配置 =====
  var COLS = 20;            // 列数
  var ROWS = 20;            // 行数
  var CELL = 30;            // 单格像素
  var SPEED = 200;          // 移动间隔 ms
  var TOTAL_CELLS = COLS * ROWS;

  // 游戏状态
  var STATE = { WELCOME: 0, PLAYING: 1, GAME_OVER: 2, WIN: 3 };

  // ===== DOM =====
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");

  // ===== 运行时变量 =====
  var state = STATE.WELCOME;
  var snake = [];       // 蛇身数组，snake[0] 为蛇头
  var dir = { x: 1, y: 0 };      // 已提交的移动方向
  var nextDir = { x: 1, y: 0 };  // 下一帧待应用方向
  var food = { x: 0, y: 0 };
  var score = 0;
  var timer = null;

  // ===== 工具：兼容圆角矩形 =====
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // ===== 初始化一局 =====
  function initGame() {
    // 初始 3 节，位于地图中部，朝右
    snake = [
      { x: 8, y: 10 },
      { x: 9, y: 10 },
      { x: 10, y: 10 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    scoreEl.textContent = "分数：0";
    spawnFood();
  }

  // ===== 生成食物（禁止落在蛇身上）=====
  function spawnFood() {
    while (true) {
      var fx = Math.floor(Math.random() * COLS);
      var fy = Math.floor(Math.random() * ROWS);
      var onSnake = false;
      for (var i = 0; i < snake.length; i++) {
        if (snake[i].x === fx && snake[i].y === fy) {
          onSnake = true;
          break;
        }
      }
      if (!onSnake) {
        food = { x: fx, y: fy };
        return;
      }
    }
  }

  // ===== 绘制 =====
  function draw() {
    // 背景
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 食物（蓝色，圆角）
    ctx.fillStyle = "#1e6fff";
    roundRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4, 5);

    // 蛇身（橙色，从尾到头画，保证头在最上层）
    for (var i = snake.length - 1; i >= 1; i--) {
      var s = snake[i];
      ctx.fillStyle = "#ff8c1a";
      roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 4);
    }

    // 蛇头（红色，更大圆角）
    var head = snake[0];
    ctx.fillStyle = "#e63946";
    roundRect(head.x * CELL + 1, head.y * CELL + 1, CELL - 2, CELL - 2, 7);

    // 状态遮罩
    if (state === STATE.WELCOME) {
      drawOverlay("贪吃蛇", "按 空格键 开始游戏", "WASD 控制方向  ·  P 结束游戏");
    } else if (state === STATE.GAME_OVER) {
      drawOverlay("游戏结束", "最终分数：" + score, "按 空格键 重新开始");
    } else if (state === STATE.WIN) {
      drawOverlay("恭喜通关！", "最终分数：" + score, "按 空格键 重新开始");
    }
  }

  function drawOverlay(title, sub, hint) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px 'Microsoft YaHei', sans-serif";
    ctx.fillText(title, 300, 240);

    ctx.font = "24px 'Microsoft YaHei', sans-serif";
    ctx.fillText(sub, 300, 305);

    ctx.fillStyle = "#dddddd";
    ctx.font = "18px 'Microsoft YaHei', sans-serif";
    ctx.fillText(hint, 300, 360);
  }

  // ===== 单帧逻辑 =====
  function tick() {
    // 应用待转向
    dir = nextDir;

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver();
      return;
    }

    // 是否吃到食物
    var willEat = (head.x === food.x && head.y === food.y);

    // 撞自身：若不吃食物，尾巴会移走，因此排除最后一节
    var checkBody = willEat ? snake : snake.slice(0, -1);
    for (var i = 0; i < checkBody.length; i++) {
      if (checkBody[i].x === head.x && checkBody[i].y === head.y) {
        gameOver();
        return;
      }
    }

    // 移动
    snake.unshift(head);

    if (willEat) {
      score++;
      scoreEl.textContent = "分数：" + score;

      // 占满全图 → 胜利
      if (snake.length >= TOTAL_CELLS) {
        win();
        return;
      }
      spawnFood();
    } else {
      snake.pop();
    }

    draw();
  }

  // ===== 状态切换 =====
  function startGame() {
    initGame();
    state = STATE.PLAYING;
    if (timer) clearInterval(timer);
    timer = setInterval(tick, SPEED);
    draw();
  }

  function gameOver() {
    state = STATE.GAME_OVER;
    if (timer) { clearInterval(timer); timer = null; }
    draw();
  }

  function win() {
    state = STATE.WIN;
    if (timer) { clearInterval(timer); timer = null; }
    draw();
  }

  // ===== 键盘输入 =====
  document.addEventListener("keydown", function (e) {
    var key = e.key.toLowerCase();

    // 空格：开始 / 重开
    if (key === " " || e.code === "Space") {
      e.preventDefault();
      if (state === STATE.WELCOME || state === STATE.GAME_OVER || state === STATE.WIN) {
        startGame();
      }
      return;
    }

    // 非游戏中，WASD / P 不响应
    if (state !== STATE.PLAYING) return;

    // P：手动结束
    if (key === "p") {
      e.preventDefault();
      gameOver();
      return;
    }

    // 方向输入
    var nd = null;
    if (key === "w") nd = { x: 0, y: -1 };
    else if (key === "s") nd = { x: 0, y: 1 };
    else if (key === "a") nd = { x: -1, y: 0 };
    else if (key === "d") nd = { x: 1, y: 0 };

    if (nd) {
      e.preventDefault();
      // 禁止 180° 反向掉头：与已提交方向比较
      if (nd.x === -dir.x && nd.y === -dir.y) return;
      nextDir = nd;
    }
  });

  // ===== 启动 =====
  initGame();
  draw();
})();
</script>
</body>
</html>
