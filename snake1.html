<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
    background:#eee;
}
#container{
    position:relative;
}
#score{
    position:absolute;
    top:8px;
    right:8px;
    font-size:18px;
    font-weight:bold;
}
#gameCanvas{
    border:1px solid #999;
    background:#fff;
}
#tipText{
    margin-top:12px;
    font-size:16px;
}
</style>
</head>
<body>
<div id="container">
    <div id="score">分数：0</div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
</div>
<div id="tipText">按 空格 开始游戏</div>

<script>
const CELL_SIZE = 30;
const COLS = 20;
const ROWS = 20;
const INTERVAL = 200;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDom = document.getElementById('score');
const tipDom = document.getElementById('tipText');

// 游戏状态：ready / playing / gameover / win
let gameState = 'ready';
let snake = [];
let dir = {x:1,y:0};
let nextDir = {x:1,y:0};
let food = {x:0,y:0};
let score = 0;
let timer = null;

function initGame(){
    score = 0;
    scoreDom.textContent = `分数：${score}`;
    // 蛇初始在中间，长度3，向右
    snake = [
        {x:10,y:10},
        {x:9,y:10},
        {x:8,y:10}
    ];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    spawnFood();
    gameState = 'playing';
    tipDom.textContent = '';
}

function spawnFood(){
    let newFood;
    do{
        newFood = {
            x:Math.floor(Math.random()*COLS),
            y:Math.floor(Math.random()*ROWS)
        };
    }while(snake.some(p=>p.x===newFood.x && p.y===newFood.y));
    food = newFood;
}

function draw(){
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // 绘制食物 蓝色
    ctx.fillStyle='#0066ff';
    ctx.fillRect(food.x*CELL_SIZE, food.y*CELL_SIZE, CELL_SIZE, CELL_SIZE);

    // 绘制蛇
    snake.forEach((seg,idx)=>{
        if(idx===0){
            // 蛇头红色，小圆角
            ctx.fillStyle='#ff3333';
            roundRect(ctx, seg.x*CELL_SIZE, seg.y*CELL_SIZE, CELL_SIZE, CELL_SIZE,7);
        }else{
            // 蛇身橙色
            ctx.fillStyle='#ff9900';
            roundRect(ctx, seg.x*CELL_SIZE, seg.y*CELL_SIZE, CELL_SIZE, CELL_SIZE,4);
        }
    });
}

function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w‑r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h‑r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
    ctx.fill();
}

function gameLoop(){
    dir = {...nextDir};
    const head = {...snake[0]};
    head.x += dir.x;
    head.y += dir.y;

    // 撞墙判断
    if(head.x<0 || head.x>=COLS || head.y<0 || head.y>=ROWS){
        return gameOver();
    }
    // 撞自己
    if(snake.some(p=>p.x===head.x && p.y===head.y)){
        return gameOver();
    }

    snake.unshift(head);
    // 吃到食物
    if(head.x===food.x && head.y===food.y){
        score +=1;
        scoreDom.textContent = `分数：${score}`;
        // 胜利条件填满地图
        if(snake.length >= COLS*ROWS){
            return gameWin();
        }
        spawnFood();
    }else{
        snake.pop();
    }
    draw();
}

function gameOver(){
    gameState = 'gameover';
    clearInterval(timer);
    tipDom.textContent = `游戏结束，分数：${score}，按空格重新开局`;
}
function gameWin(){
    gameState = 'win';
    clearInterval(timer);
    tipDom.textContent = `恭喜通关！分数：${score}，按空格重新开局`;
}

document.addEventListener('keydown',(e)=>{
    const key = e.key.toLowerCase();
    // 空格逻辑严格区分状态
    if(key === ' '){
        if(gameState === 'ready'){
            initGame();
            timer = setInterval(gameLoop, INTERVAL);
        }else if(gameState === 'gameover' || gameState === 'win'){
            clearInterval(timer);
            initGame();
            timer = setInterval(gameLoop, INTERVAL);
        }
        // playing状态下：空格什么都不做
        return;
    }

    if(gameState !== 'playing') return;

    // WASD 转向，禁止180反向
    if(key === 'w'){
        if(dir.y !== 1) nextDir = {x:0,y:-1};
    }else if(key === 's'){
        if(dir.y !== -1) nextDir = {x:0,y:1};
    }else if(key === 'a'){
        if(dir.x !== 1) nextDir = {x:-1,y:0};
    }else if(key === 'd'){
        if(dir.x !== -1) nextDir = {x:1,y:0};
    }else if(key === 'p'){
        gameOver();
    }
});

// 初始渲染
draw();
</script>
</body>
</html>
